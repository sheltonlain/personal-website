{% extends "base.html" %}

{% block content %}
    <h1>My To-Do List</h1>
    <p>You have {{ tasks|length }} to-do's listed.</p>

    <ul>
    {% for task in tasks %}
        <li>
            {{ task.title }}
            {% if task.done %}
                - Completed
            {% else %}
                - In progress
            {% endif %}
        </li>
    {% endfor %}
    </ul>
{% endblock %}
